name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo test --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --manifest-path onchain/Cargo.toml
      - run: cargo clippy --manifest-path onchain/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path onchain/Cargo.toml --all -- --check
      - run: npm test
        working-directory: packages/merkle-ts
      - run: npm test
        working-directory: packages/canonical-ts
      - run: npm ci
        working-directory: apps/verifier
      - run: npm test
        working-directory: apps/verifier
      - run: npm run typecheck
        working-directory: apps/verifier
      - run: node --test --experimental-strip-types tests/e2e/*.test.ts
      - run: npm ci
        working-directory: apps/monitor
      - run: npm run typecheck
        working-directory: apps/monitor
      - run: npm test
        working-directory: apps/monitor
      - run: npm ci
        working-directory: packages/snapshot-ts
      - run: npm run typecheck
        working-directory: packages/snapshot-ts
      - run: npm test
        working-directory: packages/snapshot-ts
