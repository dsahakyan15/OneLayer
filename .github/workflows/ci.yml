name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all

      # Векторы заморожены: перегенерация не должна менять файлы в репозитории.
      # Расхождение = изменение протокола, требующее ADR и инкремента версии схемы.
      - name: golden vectors are frozen
        run: |
          cargo run -q -p onelayer-canonical --bin gen-vectors
          git diff --exit-code -- spec/vectors
