[package]
name = "alloc-spike"
version = "0.1.0"
edition = "2021"
description = "OL-A-04: эмпирическая проверка выделения PDA > 10 КБ"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "alloc_spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
bytemuck = { version = "1", features = ["derive"] }
