name: onelayer-devnet-demo

x-demo-labels: &demo-labels
  com.onelayer.fixture: "true"
  com.onelayer.environment: "synthetic-devnet-demo"

x-service-security: &service-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"

services:
  postgres:
    image: postgres:17.5
    labels: *demo-labels
    environment:
      POSTGRES_DB: onelayer_demo
      POSTGRES_USER: onelayer_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onelayer_demo -d onelayer_demo"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped

  migrate:
    image: postgres:17.5
    labels: *demo-labels
    <<: *service-security
    entrypoint: [/demo/migrate]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: onelayer_demo
      PGUSER: onelayer_demo
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ../../db/migrations:/migrations:ro
      - ../../db/fixtures:/fixtures:ro
      - ./scripts/migrate:/demo/migrate:ro
    tmpfs: [/tmp]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  demo-api:
    build:
      context: ../..
      dockerfile: deploy/devnet-demo/Dockerfile.demo-api
    labels: *demo-labels
    <<: *service-security
    environment:
      PORT: "8090"
      ONELAYER_DATABASE_URL_FILE: /run/secrets/database_url
      ONELAYER_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      ONELAYER_RPC_URL: https://api.devnet.solana.com
      ONELAYER_VERIFIER_URL: http://127.0.0.1:8080
      ONELAYER_PUBLIC_BASE_URL: http://127.0.0.1:8090
    secrets: [database_url, internal_token]
    ports: ["127.0.0.1:8090:8090"]
    tmpfs: [/tmp]
    networks: [data, devnet]
    depends_on:
      migrate: { condition: service_completed_successfully }

  verifier:
    build:
      context: ../..
      dockerfile: deploy/devnet-demo/Dockerfile.verifier
    labels: *demo-labels
    <<: *service-security
    environment:
      PORT: "8080"
      ONELAYER_RPC_URL: https://api.devnet.solana.com
      ONELAYER_INCIDENT_INDEX_URL: http://demo-api:8090
      ONELAYER_LOOKUP_URL: http://demo-api:8090
      ONELAYER_MAX_INDEX_LAG_SLOTS: "5000"
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: [/tmp]
    networks: [data, devnet]
    depends_on: [demo-api]

  clean-room-db:
    profiles: [recovery]
    image: postgres:17.5
    labels: *demo-labels
    environment:
      POSTGRES_DB: onelayer_restored
      POSTGRES_USER: onelayer_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_password
    secrets: [restore_password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onelayer_restore -d onelayer_restored"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [clean-room-data:/var/lib/postgresql/data]
    networks: [restore]
    restart: "no"

networks:
  data: { internal: true }
  restore: { internal: true }
  devnet: {}

volumes:
  postgres-data: { labels: *demo-labels }
  clean-room-data: { labels: *demo-labels }

secrets:
  postgres_password:
    file: /dev/shm/onelayer-devnet-demo/postgres-password
  restore_password:
    file: /dev/shm/onelayer-devnet-demo/restore-password
  database_url:
    file: /dev/shm/onelayer-devnet-demo/database-url
  internal_token:
    file: /dev/shm/onelayer-devnet-demo/internal-token
